<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · Felix</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--surface:#161616;--surface2:#1e1e1e;--border:#252525;--text:#e2ddd6;--text-dim:#5a5550;--text-mid:#9a9590;--accent:#c9a96e;--accent-dim:#6b5030;--user-bg:#1a1816;--ai-bg:#111111;--radius:3px;--sidebar:230px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif SC',serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.lock-box{display:flex;flex-direction:column;align-items:center;gap:16px;width:240px}
.lock-title{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.18em;color:var(--accent);text-transform:uppercase}
.lock-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Mono',monospace;font-size:20px;letter-spacing:0.25em;padding:10px 14px;outline:none;text-align:center;transition:border-color 0.2s}
.lock-input:focus{border-color:var(--accent-dim)}
.lock-error{font-family:'DM Mono',monospace;font-size:11px;color:#c0392b;letter-spacing:0.08em;min-height:16px}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform 0.25s}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-size:12px;font-family:'DM Mono',monospace;letter-spacing:0.14em;color:var(--accent);text-transform:uppercase}
.sidebar-close{display:none;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-btn{background:none;border:none;color:var(--text-mid);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;padding:9px 10px;cursor:pointer;border-radius:var(--radius);text-align:left;text-transform:uppercase;transition:all 0.15s;display:block;width:100%;text-decoration:none}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--surface2);border-left:2px solid var(--accent);color:var(--accent);padding-left:8px}
.nav-sep{height:1px;background:var(--border);margin:4px 2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;padding:12px 20px 10px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.menu-btn{display:none;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:2px}
.topbar-title{font-size:12px;font-family:'DM Mono',monospace;letter-spacing:0.08em;color:var(--text-mid);flex:1}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:4px 10px;cursor:pointer;border-radius:var(--radius);transition:all 0.15s;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn-sm:hover{border-color:var(--accent-dim);color:var(--accent)}
.btn-sm:disabled{opacity:0.4;cursor:not-allowed}
.briefing{border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.briefing-header{display:flex;align-items:center;padding:10px 20px;gap:10px;cursor:pointer;user-select:none}
.briefing-date{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--accent);text-transform:uppercase;flex:1}
.briefing-arrow{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim)}
.briefing-body{padding:0 20px 14px;display:none}
.briefing-body.open{display:block}
.briefing-text{font-size:13px;line-height:1.8;color:var(--text-mid);white-space:pre-wrap;word-break:break-word;max-height:180px;overflow-y:auto}
.briefing-text::-webkit-scrollbar{width:3px}
.briefing-text::-webkit-scrollbar-thumb{background:var(--border)}
.briefing-actions{margin-top:8px;display:flex;gap:6px}
.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border)}
.message{display:flex;padding:18px 24px;gap:14px;border-bottom:1px solid var(--border);animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.message.user{background:var(--user-bg)}
.message.assistant{background:var(--ai-bg)}
.avatar{width:26px;height:26px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.05em;flex-shrink:0;margin-top:2px}
.message.user .avatar{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-dim)}
.message.assistant .avatar{background:var(--border);color:var(--text-dim);border:1px solid var(--border)}
.content{flex:1;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.message.user .content{color:#ccc8c0}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:1px;vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;opacity:0.3}
.empty-glyph{font-size:36px;color:var(--accent);font-family:'DM Mono',monospace}
.empty-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase}
.input-area{border-top:1px solid var(--border);padding:14px 20px 18px;flex-shrink:0;background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:15px;font-weight:300;line-height:1.6;padding:10px 13px;resize:none;min-height:44px;max-height:150px;outline:none;transition:border-color 0.2s}
textarea::placeholder{color:var(--text-dim)}
textarea:focus{border-color:var(--accent-dim)}
.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;color:#0f0f0f}
.send-btn:hover{background:#dbb97e;transform:translateY(-1px)}
.send-btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;transform:none}
.send-btn svg{width:16px;height:16px}
.hint{margin-top:7px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.04em}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}
.sidebar-backdrop.open{display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.mem-label{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px}
.mem-block{margin-bottom:14px}
.mem-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:300;line-height:1.7;padding:10px 12px;resize:vertical;min-height:90px;outline:none;transition:border-color 0.2s}
.mem-textarea:focus{border-color:var(--accent-dim)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@media(max-width:640px){.sidebar{position:fixed;top:0;left:0;height:100%;z-index:100;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-close{display:block}.menu-btn{display:block}.hint{display:none}.message{padding:14px 16px;gap:10px}.content{font-size:14px}.input-area{padding:10px 14px 14px}}
</style>
</head>
<body>
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">Felix · 工作台</div>
    <input class="lock-input" id="lockInput" type="password" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="lock-error" id="lockError"></div>
  </div>
</div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">工作台</span>
      <button class="sidebar-close" onclick="closeSidebar()">×</button>
    </div>
    <div class="sidebar-nav">
      <span class="nav-btn active">工 作</span>
      <div class="nav-sep"></div>
      <a class="nav-btn" href="/casual.html">闲 聊</a>
      <div class="nav-sep"></div>
      <button class="nav-btn" onclick="openMemory();closeSidebar()">记 忆</button>
      <a class="nav-btn" href="https://console.anthropic.com" target="_blank">用 量</a>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbarDate"></div>
      <button class="btn-sm" onclick="openMemory()">记忆</button>
    </div>
    <div class="briefing" id="briefingSection">
      <div class="briefing-header" onclick="toggleBriefing()">
        <span class="briefing-date" id="briefingLabel">今日简报</span>
        <span class="briefing-arrow" id="briefingArrow">▾</span>
      </div>
      <div class="briefing-body" id="briefingBody">
        <div class="briefing-text" id="briefingText"><span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim)">加载中...</span></div>
        <div class="briefing-actions">
          <button class="btn-sm" id="briefingBtn" onclick="generateBriefing()">生成今日简报</button>
        </div>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty"><div class="empty-glyph">W</div><div class="empty-label">开始工作对话</div></div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="输入消息..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<div class="overlay" id="memoryOverlay" onclick="closeMemoryIfOutside(event)">
  <div class="modal">
    <div class="modal-title">记忆</div>
    <div class="mem-block">
      <div class="mem-label">个人记忆</div>
      <textarea class="mem-textarea" id="personalMemory" placeholder="关于你的信息、偏好、习惯..." rows="4"></textarea>
    </div>
    <div class="mem-block">
      <div class="mem-label">工作记忆</div>
      <textarea class="mem-textarea" id="workMemory" placeholder="工作背景、项目状态、重要联系人..." rows="5"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeMemory()">取消</button>
      <button class="btn-sm" onclick="saveMemory()" style="border-color:var(--accent-dim);color:var(--accent)">保存</button>
    </div>
  </div>
</div>
<script>
const PWD='092430';
function checkPassword(){const v=document.getElementById('lockInput').value;if(v===PWD){localStorage.setItem('felix_auth','1');document.getElementById('lockScreen').style.display='none';init()}else{document.getElementById('lockError').textContent='密码错误';document.getElementById('lockInput').value=''}}
if(localStorage.getItem('felix_auth')==='1'){document.getElementById('lockScreen').style.display='none'}else{setTimeout(()=>document.getElementById('lockInput').focus(),100)}

let workConvId=null,isStreaming=false,briefingOpen=false;

function setTopbarDate(){const d=new Date();document.getElementById('topbarDate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});document.getElementById('briefingLabel').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'  简报'}

function toggleBriefing(){briefingOpen=!briefingOpen;document.getElementById('briefingBody').classList.toggle('open',briefingOpen);document.getElementById('briefingArrow').textContent=briefingOpen?'▴':'▾'}

async function loadBriefing(){const res=await fetch('/api/briefing/felix');const data=await res.json();const el=document.getElementById('briefingText');const btn=document.getElementById('briefingBtn');if(data&&data.content){el.textContent=data.content;btn.textContent='刷新简报'}else{el.innerHTML='<span style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--text-dim)">暂无简报</span>';btn.textContent='生成今日简报'}}

async function generateBriefing(){const el=document.getElementById('briefingText');const btn=document.getElementById('briefingBtn');btn.disabled=true;btn.textContent='生成中...';if(!briefingOpen)toggleBriefing();el.textContent='';let text='';try{const res=await fetch('/api/briefing/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'felix'})});const reader=res.body.getReader();const dec=new TextDecoder();while(true){const{done,value}=await reader.read();if(done)break;for(const line of dec.decode(value).split('\n')){if(!line.startsWith('data: '))continue;try{const d=JSON.parse(line.slice(6));if(d.text){text+=d.text;el.textContent=text}if(d.done)btn.textContent='刷新简报'}catch(e){}}}}catch(e){el.textContent='生成失败，请重试'}btn.disabled=false}

async function loadWorkConv(){const res=await fetch('/api/work-conversation/felix');const conv=await res.json();workConvId=conv.id;const msgs=await fetch('/api/conversations/'+conv.id+'/messages').then(r=>r.json());const c=document.getElementById('messages');c.innerHTML='';if(msgs.length===0){c.innerHTML='<div class="empty"><div class="empty-glyph">W</div><div class="empty-label">开始工作对话</div></div>'}else{msgs.forEach(m=>appendMsg(m.role,m.content,false));scrollBot()}document.getElementById('input').focus()}

function appendMsg(role,content,animate=true){const c=document.getElementById('messages');const e=c.querySelector('.empty');if(e)e.remove();const d=document.createElement('div');d.className='message '+role;if(!animate)d.style.animation='none';d.innerHTML='<div class="avatar">'+(role==='user'?'YOU':'AI')+'</div><div class="content">'+esc(content)+'</div>';c.appendChild(d);return d.querySelector('.content')}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scrollBot(){const c=document.getElementById('messages');c.scrollTop=c.scrollHeight}

async function sendMessage(){if(isStreaming||!workConvId)return;const inp=document.getElementById('input');const msg=inp.value.trim();if(!msg)return;inp.value='';autoResize(inp);isStreaming=true;document.getElementById('sendBtn').disabled=true;appendMsg('user',msg);scrollBot();const c=document.getElementById('messages');const d=document.createElement('div');d.className='message assistant';d.innerHTML='<div class="avatar">AI</div><div class="content"><span class="cursor"></span></div>';c.appendChild(d);const cel=d.querySelector('.content');scrollBot();let full='';try{const res=await fetch('/api/conversations/'+workConvId+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,user:'felix'})});const reader=res.body.getReader();const dec=new TextDecoder();while(true){const{done,value}=await reader.read();if(done)break;for(const line of dec.decode(value).split('\n')){if(!line.startsWith('data: '))continue;try{const data=JSON.parse(line.slice(6));if(data.text){full+=data.text;cel.innerHTML=esc(full)+'<span class="cursor"></span>';scrollBot()}if(data.done)cel.innerHTML=esc(data.cleanText||full);if(data.error)cel.innerHTML='<span style="color:#c0392b">错误: '+data.error+'</span>'}catch(e){}}}}catch(e){cel.innerHTML='<span style="color:#c0392b">连接错误，请重试</span>'}isStreaming=false;document.getElementById('sendBtn').disabled=false;inp.focus()}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarBackdrop').classList.toggle('open')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('open')}
;(function(){let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<Math.abs(dy)*1.2)return;const sb=document.getElementById('sidebar');if(dx<-50&&sb.classList.contains('open'))closeSidebar();if(dx>60&&tx<30&&!sb.classList.contains('open')){sb.classList.add('open');document.getElementById('sidebarBackdrop').classList.add('open')}},{passive:true});}())

async function openMemory(){document.getElementById('memoryOverlay').classList.add('open');const r=await fetch('/api/memory-doc/felix');const d=await r.json();document.getElementById('personalMemory').value=d.personal||'';document.getElementById('workMemory').value=d.work||''}
function closeMemory(){document.getElementById('memoryOverlay').classList.remove('open')}
function closeMemoryIfOutside(e){if(e.target===document.getElementById('memoryOverlay'))closeMemory()}
async function saveMemory(){await fetch('/api/memory-doc/felix',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({personal:document.getElementById('personalMemory').value,work:document.getElementById('workMemory').value})});closeMemory()}

function init(){setTopbarDate();loadBriefing();loadWorkConv()}
if(localStorage.getItem('felix_auth')==='1')init();
</script>
</body>
</html>
