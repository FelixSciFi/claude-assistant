<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicole · AI助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=DM+Mono:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--surface:#f4f0eb;--surface2:#ede8e1;--border:#e0d8ce;--text:#2c2520;--text-dim:#b0a89e;--text-mid:#7a7068;--accent:#a07850;--accent-light:#e8d8c4;--accent-dim:#d4b896;--user-bg:#f9f6f2;--ai-bg:#faf8f5;--radius:4px;--sidebar:260px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif SC',serif;font-weight:300;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform 0.25s}
.sidebar-header{padding:20px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:0.08em;color:var(--accent);font-style:italic}
.new-btn{background:none;border:1px solid var(--border);color:var(--text-mid);font-family:'DM Mono',monospace;font-size:18px;line-height:1;width:28px;height:28px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.new-btn:hover{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-light)}
.sidebar-close{display:none;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-list::-webkit-scrollbar{width:3px}
.conv-list::-webkit-scrollbar-thumb{background:var(--border)}
.conv-item{padding:9px 10px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:background 0.15s;margin-bottom:2px}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--accent-light);border-left:2px solid var(--accent-dim);padding-left:8px}
.conv-name{font-size:13px;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.4}
.conv-item.active .conv-name{color:var(--text)}
.conv-del{background:none;border:none;color:transparent;cursor:pointer;font-size:14px;flex-shrink:0;padding:2px;line-height:1;transition:color 0.15s}
.conv-item:hover .conv-del{color:var(--text-dim)}
.conv-del:hover{color:#c0392b !important}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;padding:16px 24px 14px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;background:var(--surface)}
.menu-btn{display:none;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:2px}
.topbar-brand{display:flex;flex-direction:column;flex:1}
.topbar-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;font-style:italic;color:var(--accent);letter-spacing:0.04em;line-height:1}
.conv-title-display{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;letter-spacing:0.06em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;gap:6px}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:4px 10px;cursor:pointer;border-radius:var(--radius);transition:all 0.15s;text-transform:uppercase}
.btn-sm:hover{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-light)}
.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border)}
.message{display:flex;padding:20px 28px;gap:14px;border-bottom:1px solid var(--border);animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.user{background:var(--user-bg)}
.message.assistant{background:var(--ai-bg)}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:12px;flex-shrink:0;margin-top:3px;font-style:italic}
.message.user .avatar{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-dim)}
.message.assistant .avatar{background:var(--surface2);color:var(--text-mid);border:1px solid var(--border)}
.content{flex:1;font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.message.user .content{color:var(--text-mid)}
.message.assistant .content{color:var(--text)}
.cursor{display:inline-block;width:1.5px;height:1em;background:var(--accent);margin-left:1px;vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;opacity:0.4}
.empty-glyph{font-family:'Cormorant Garamond',serif;font-size:52px;color:var(--accent);font-style:italic}
.empty-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;color:var(--text-dim);text-transform:uppercase}
.no-conv{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;opacity:0.35}
.no-conv-glyph{font-family:'Cormorant Garamond',serif;font-size:56px;color:var(--accent);font-style:italic}
.no-conv p{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase}
.input-area{border-top:1px solid var(--border);padding:14px 24px 20px;flex-shrink:0;background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:15px;font-weight:300;line-height:1.6;padding:10px 14px;resize:none;min-height:44px;max-height:150px;outline:none;transition:border-color 0.2s}
textarea::placeholder{color:var(--text-dim)}
textarea:focus{border-color:var(--accent-dim)}
.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;color:#faf8f5}
.send-btn:hover{background:#b8895e;transform:translateY(-1px)}
.send-btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;transform:none}
.send-btn svg{width:16px;height:16px}
.hint{margin-top:7px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.04em}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(44,37,32,0.45);z-index:99}
.sidebar-backdrop.open{display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(44,37,32,0.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:440px}
.modal h2{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;font-style:italic;color:var(--accent);margin-bottom:14px}
.modal textarea{width:100%;height:90px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:640px){.sidebar{position:fixed;top:0;left:0;height:100%;z-index:100;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.menu-btn{display:block}.sidebar-close{display:block}.hint{display:none}.message{padding:14px 16px;gap:10px}.content{font-size:14px}.input-area{padding:10px 14px 16px}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Nicole</span>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="new-btn" onclick="newConversation()" title="新对话">+</button>
        <button class="sidebar-close" onclick="closeSidebar()">×</button>
      </div>
    </div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="topbar-brand">
        <div class="topbar-name">Nicole</div>
        <div class="conv-title-display" id="convTitleDisplay">选择或新建对话</div>
      </div>
      <div class="topbar-actions">
        <button class="btn-sm" onclick="openMemory()">记忆</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="no-conv" id="noConv">
        <div class="no-conv-glyph">N</div>
        <p>新建或选择对话</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="输入消息..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<div class="overlay" id="memoryOverlay" onclick="closeMemoryIfOutside(event)">
  <div class="modal">
    <h2>添加记忆</h2>
    <textarea id="memoryInput" placeholder="输入需要记住的信息..."></textarea>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeMemory()">取消</button>
      <button class="btn-sm" onclick="saveMemory()" style="border-color:var(--accent-dim);color:var(--accent)">保存</button>
    </div>
  </div>
</div>
<script>
let currentConvId=null,isStreaming=false,conversations=[];
async function loadConversations(){const res=await fetch('/api/conversations?user=nicole');conversations=await res.json();renderConvList();if(conversations.length>0&&!currentConvId)selectConversation(conversations[0].id)}
function renderConvList(){const list=document.getElementById('convList');list.innerHTML='';conversations.forEach(conv=>{const div=document.createElement('div');div.className='conv-item'+(conv.id===currentConvId?' active':'');div.dataset.id=conv.id;div.innerHTML=`<span class="conv-name">${escHtml(conv.title)}</span><button class="conv-del" onclick="deleteConv(event,${conv.id})">x</button>`;div.addEventListener('click',e=>{if(!e.target.classList.contains('conv-del'))selectConversation(conv.id)});list.appendChild(div)})}
async function newConversation(){const res=await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'nicole'})});const conv=await res.json();conversations.unshift(conv);renderConvList();selectConversation(conv.id);closeSidebar()}
async function deleteConv(e,id){e.stopPropagation();if(!confirm('删除这个对话？'))return;await fetch('/api/conversations/'+id,{method:'DELETE'});conversations=conversations.filter(c=>c.id!==id);if(currentConvId===id){currentConvId=null;document.getElementById('messages').innerHTML='<div class="no-conv"><div class="no-conv-glyph">N</div><p>新建或选择对话</p></div>';document.getElementById('convTitleDisplay').textContent='选择或新建对话'}renderConvList()}
async function selectConversation(id){currentConvId=id;renderConvList();const conv=conversations.find(c=>c.id===id);document.getElementById('convTitleDisplay').textContent=conv?conv.title:'';const res=await fetch('/api/conversations/'+id+'/messages');const msgs=await res.json();const container=document.getElementById('messages');container.innerHTML='';if(msgs.length===0){container.innerHTML='<div class="empty"><div class="empty-glyph">N</div><div class="empty-label">开始对话</div></div>'}else{msgs.forEach(m=>appendMessage(m.role,m.content,false));scrollToBottom()}document.getElementById('input').focus()}
function appendMessage(role,content,animate=true){const container=document.getElementById('messages');const empty=container.querySelector('.empty,.no-conv');if(empty)empty.remove();const div=document.createElement('div');div.className='message '+role;if(!animate)div.style.animation='none';const avatarLabel=role==='user'?'你':'N';div.innerHTML=`<div class="avatar">${avatarLabel}</div><div class="content">${escHtml(content)}</div>`;container.appendChild(div);return div.querySelector('.content')}
function escHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scrollToBottom(){const c=document.getElementById('messages');c.scrollTop=c.scrollHeight}
async function sendMessage(){if(isStreaming||!currentConvId)return;const input=document.getElementById('input');const message=input.value.trim();if(!message)return;input.value='';autoResize(input);isStreaming=true;document.getElementById('sendBtn').disabled=true;appendMessage('user',message);scrollToBottom();const container=document.getElementById('messages');const div=document.createElement('div');div.className='message assistant';div.innerHTML='<div class="avatar">N</div><div class="content"><span class="cursor"></span></div>';container.appendChild(div);const contentEl=div.querySelector('.content');scrollToBottom();let fullText='';try{const res=await fetch('/api/conversations/'+currentConvId+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,user:'nicole'})});const reader=res.body.getReader();const decoder=new TextDecoder();while(true){const{done,value}=await reader.read();if(done)break;const lines=decoder.decode(value).split('\n');for(const line of lines){if(!line.startsWith('data: '))continue;try{const data=JSON.parse(line.slice(6));if(data.text){fullText+=data.text;contentEl.innerHTML=escHtml(fullText)+'<span class="cursor"></span>';scrollToBottom()}if(data.done){contentEl.innerHTML=escHtml(fullText);if(data.title){const conv=conversations.find(c=>c.id===currentConvId);if(conv){conv.title=data.title;renderConvList();document.getElementById('convTitleDisplay').textContent=data.title}}}if(data.error)contentEl.innerHTML='<span style="color:#c0392b">错误: '+data.error+'</span>'}catch(e){}}}}catch(e){contentEl.innerHTML='<span style="color:#c0392b">连接错误，请重试</span>'}isStreaming=false;document.getElementById('sendBtn').disabled=false;input.focus()}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}
function toggleSidebar(){const s=document.getElementById('sidebar');const b=document.getElementById('sidebarBackdrop');s.classList.toggle('open');b.classList.toggle('open')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('open')}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('open')}
;(function(){let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<Math.abs(dy)*1.2)return;if(dx<-50&&document.getElementById('sidebar').classList.contains('open'))closeSidebar();if(dx>60&&tx<30&&!document.getElementById('sidebar').classList.contains('open'))openSidebar();},{passive:true});}())
function openMemory(){document.getElementById('memoryOverlay').classList.add('open');document.getElementById('memoryInput').focus()}
function closeMemory(){document.getElementById('memoryOverlay').classList.remove('open');document.getElementById('memoryInput').value=''}
function closeMemoryIfOutside(e){if(e.target===document.getElementById('memoryOverlay'))closeMemory()}
async function saveMemory(){const content=document.getElementById('memoryInput').value.trim();if(!content)return;await fetch('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,user:'nicole'})});closeMemory()}
loadConversations();
</script>
</body>
</html>
