<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲聊 · Felix</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--surface:#161616;--surface2:#1e1e1e;--border:#252525;--text:#e2ddd6;--text-dim:#5a5550;--text-mid:#9a9590;--accent:#c9a96e;--accent-dim:#6b5030;--user-bg:#1a1816;--ai-bg:#111111;--radius:3px;--sidebar:230px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif SC',serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}html{font-size:100%}body{font-size:clamp(0.875rem,2.5vw,1.125rem)}
.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.lock-box{display:flex;flex-direction:column;align-items:center;gap:16px;width:240px}
.lock-title{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.18em;color:var(--accent);text-transform:uppercase}
.lock-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Mono',monospace;font-size:20px;letter-spacing:0.25em;padding:10px 14px;outline:none;text-align:center;transition:border-color 0.2s}
.lock-input:focus{border-color:var(--accent-dim)}
.lock-error{font-family:'DM Mono',monospace;font-size:11px;color:#c0392b;letter-spacing:0.08em;min-height:16px}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform 0.25s}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-size:12px;font-family:'DM Mono',monospace;letter-spacing:0.14em;color:var(--accent);text-transform:uppercase}
.sidebar-top{display:flex;gap:6px;align-items:center}
.new-btn{background:none;border:1px solid var(--border);color:var(--text-mid);font-family:'DM Mono',monospace;font-size:18px;line-height:1;width:28px;height:28px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.new-btn:hover{border-color:var(--accent-dim);color:var(--accent)}
.sidebar-close{display:none;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
.sidebar-footer{border-top:1px solid var(--border);padding:8px}
.nav-link{background:none;border:none;color:var(--text-dim);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;padding:8px 10px;cursor:pointer;border-radius:var(--radius);text-align:left;text-transform:uppercase;transition:all 0.15s;display:block;width:100%;text-decoration:none}
.nav-link:hover{background:var(--surface2);color:var(--text)}
.conv-list{flex:1;overflow-y:auto;padding:6px}
.conv-list::-webkit-scrollbar{width:3px}
.conv-list::-webkit-scrollbar-thumb{background:var(--border)}
.conv-item{padding:9px 10px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:background 0.15s;margin-bottom:1px}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);border-left:2px solid var(--accent);padding-left:8px}
.conv-name{font-size:13px;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.4}
.conv-item.active .conv-name{color:var(--text)}
.conv-del{background:none;border:none;color:transparent;cursor:pointer;font-size:14px;flex-shrink:0;padding:2px;line-height:1;transition:color 0.15s}
.conv-item:hover .conv-del{color:var(--text-dim)}
.conv-del:hover{color:#c0392b !important}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;padding:12px 20px 10px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.menu-btn{display:none;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:2px}
.conv-title-display{font-size:13px;color:var(--text-mid);font-family:'DM Mono',monospace;letter-spacing:0.05em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;gap:6px}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;padding:4px 10px;cursor:pointer;border-radius:var(--radius);transition:all 0.15s;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn-sm:hover{border-color:var(--accent-dim);color:var(--accent)}
.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border)}
.message{display:flex;padding:18px 24px;gap:14px;border-bottom:1px solid var(--border);animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.message.user{background:var(--user-bg)}
.message.assistant{background:var(--ai-bg)}
.avatar{width:26px;height:26px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.05em;flex-shrink:0;margin-top:2px}
.message.user .avatar{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-dim)}
.message.assistant .avatar{background:var(--border);color:var(--text-dim);border:1px solid var(--border)}
.content{flex:1;font-size:1em;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.message.user .content{color:#ccc8c0}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:1px;vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;opacity:0.3}
.empty-glyph{font-size:36px;color:var(--accent);font-family:'DM Mono',monospace}
.empty-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase}
.no-conv{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;opacity:0.3}
.no-conv p{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase}
.input-area{border-top:1px solid var(--border);padding:14px 20px 18px;flex-shrink:0;background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.file-btn{width:36px;height:36px;background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:var(--radius);font-size:15px;transition:all 0.15s;flex-shrink:0;padding:0}
.file-btn:hover{border-color:var(--accent-dim);color:var(--accent)}
.file-preview{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);max-width:180px}
.file-preview-name{font-size:11px;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:'DM Mono',monospace}
.file-preview-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:0;flex-shrink:0}
textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:1em;font-weight:300;line-height:1.6;padding:10px 13px;resize:none;min-height:44px;max-height:150px;outline:none;transition:border-color 0.2s}
textarea::placeholder{color:var(--text-dim)}
textarea:focus{border-color:var(--accent-dim)}
.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;color:#0f0f0f}
.send-btn:hover{background:#dbb97e;transform:translateY(-1px)}
.send-btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;transform:none}
.send-btn svg{width:16px;height:16px}
.hint{margin-top:7px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.04em}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}
.sidebar-backdrop.open{display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.mem-label{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px}
.mem-block{margin-bottom:14px}
.mem-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:300;line-height:1.7;padding:10px 12px;resize:vertical;min-height:90px;outline:none;transition:border-color 0.2s}
.mem-textarea:focus{border-color:var(--accent-dim)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@media(max-width:640px){.sidebar{position:fixed;top:0;left:0;height:100%;z-index:100;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-close{display:block}.menu-btn{display:block}.hint{display:none}.message{padding:14px 16px;gap:10px}.content{font-size:14px}.input-area{padding:10px 14px 14px}}
</style>
</head>
<body>
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">Felix · 闲聊</div>
    <input class="lock-input" id="lockInput" type="password" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="lock-error" id="lockError"></div>
  </div>
</div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">闲聊</span>
      <div class="sidebar-top">
        <button class="new-btn" onclick="newConversation()" title="新对话">+</button>
        <button class="sidebar-close" onclick="closeSidebar()">×</button>
      </div>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <a class="nav-link" href="/index.html">← 工作台</a>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="conv-title-display" id="convTitleDisplay">选择或新建对话</div>
      <div class="topbar-actions">
        <button class="btn-sm" onclick="openMemory()">记忆</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="no-conv" id="noConv">
        <div style="font-size:32px;color:var(--accent);font-family:'DM Mono',monospace">C</div>
        <p>新建或选择对话</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp,.txt,.md" style="display:none" onchange="handleFileSelect(event)">
        <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="上传图片或文本">📎</button>
        <div id="filePreview" style="display:none" class="file-preview">
          <span id="fileName" class="file-preview-name"></span>
          <button class="file-preview-del" onclick="clearFile()">✕</button>
        </div>
        <textarea id="input" placeholder="输入消息..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<div class="overlay" id="memoryOverlay" onclick="closeMemoryIfOutside(event)">
  <div class="modal">
    <div class="modal-title">记忆</div>
    <div class="mem-block">
      <div class="mem-label">个人记忆</div>
      <textarea class="mem-textarea" id="personalMemory" placeholder="关于你的信息、偏好、习惯..." rows="4"></textarea>
    </div>
    <div class="mem-block">
      <div class="mem-label">工作记忆</div>
      <textarea class="mem-textarea" id="workMemory" placeholder="工作背景、项目状态、重要联系人..." rows="5"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" onclick="closeMemory()">取消</button>
      <button class="btn-sm" onclick="saveMemory()" style="border-color:var(--accent-dim);color:var(--accent)">保存</button>
    </div>
  </div>
</div>
<script>
const PWD='092430';
function checkPassword(){const v=document.getElementById('lockInput').value;if(v===PWD){localStorage.setItem('felix_auth','1');document.getElementById('lockScreen').style.display='none';loadConversations()}else{document.getElementById('lockError').textContent='密码错误';document.getElementById('lockInput').value=''}}
if(localStorage.getItem('felix_auth')==='1'){document.getElementById('lockScreen').style.display='none'}else{setTimeout(()=>document.getElementById('lockInput').focus(),100)}

let currentConvId=null,isStreaming=false,conversations=[],selectedFile=null;

async function loadConversations(){const res=await fetch('/api/conversations?user=felix');conversations=await res.json();renderConvList();const last=localStorage.getItem('felix_casual_last');const found=last&&conversations.find(c=>c.id===parseInt(last));if(found)selectConversation(found.id);else if(conversations.length>0)selectConversation(conversations[0].id)}

function renderConvList(){const list=document.getElementById('convList');list.innerHTML='';conversations.forEach(conv=>{const div=document.createElement('div');div.className='conv-item'+(conv.id===currentConvId?' active':'');div.innerHTML=`<span class="conv-name">${esc(conv.title)}</span><button class="conv-del" onclick="deleteConv(event,${conv.id})">x</button>`;div.addEventListener('click',e=>{if(!e.target.classList.contains('conv-del'))selectConversation(conv.id)});list.appendChild(div)})}

async function newConversation(){const res=await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'felix'})});const conv=await res.json();conversations.unshift(conv);renderConvList();selectConversation(conv.id);closeSidebar()}

async function deleteConv(e,id){e.stopPropagation();if(!confirm('删除这个对话？'))return;await fetch('/api/conversations/'+id,{method:'DELETE'});conversations=conversations.filter(c=>c.id!==id);if(currentConvId===id){currentConvId=null;document.getElementById('messages').innerHTML='<div class="no-conv"><div style="font-size:32px;color:var(--accent);font-family:\'DM Mono\',monospace">C</div><p>新建或选择对话</p></div>';document.getElementById('convTitleDisplay').textContent='选择或新建对话'}renderConvList()}

async function selectConversation(id){currentConvId=id;localStorage.setItem('felix_casual_last',id);renderConvList();const conv=conversations.find(c=>c.id===id);document.getElementById('convTitleDisplay').textContent=conv?conv.title:'';const res=await fetch('/api/conversations/'+id+'/messages');const msgs=await res.json();const c=document.getElementById('messages');c.innerHTML='';if(msgs.length===0){c.innerHTML='<div class="empty"><div class="empty-glyph">C</div><div class="empty-label">开始对话</div></div>'}else{msgs.forEach(m=>appendMsg(m.role,m.content,false));scrollBot()}document.getElementById('input').focus()}

function cleanContent(t){return t.replace(/\[图片:[^\]]+\]<image_data[^>]*\/>/g,'[🖼 图片]')}
function appendMsg(role,content,animate=true){const c=document.getElementById('messages');const e=c.querySelector('.empty,.no-conv');if(e)e.remove();const d=document.createElement('div');d.className='message '+role;if(!animate)d.style.animation='none';d.innerHTML='<div class="avatar">'+(role==='user'?'YOU':'AI')+'</div><div class="content">'+esc(cleanContent(content))+'</div>';c.appendChild(d);return d.querySelector('.content')}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scrollBot(){const c=document.getElementById('messages');c.scrollTop=c.scrollHeight}

function handleFileSelect(e){const f=e.target.files?.[0];if(!f)return;const isImg=/^image\/(jpeg|png|gif|webp)$/.test(f.type);const isTxt=/^text\//.test(f.type)||/\.(txt|md)$/i.test(f.name);if(!isImg&&!isTxt){alert('仅支持图片(JPG/PNG/GIF/WebP)和文本(TXT/MD)');return}if(f.size>5*1024*1024){alert('文件最大5MB');return}selectedFile=f;document.getElementById('fileName').textContent=f.name;document.getElementById('filePreview').style.display='flex'}
function clearFile(){selectedFile=null;document.getElementById('fileInput').value='';document.getElementById('filePreview').style.display='none'}
async function sendMessage(){if(isStreaming)return;if(!currentConvId){const res=await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'felix'})});const conv=await res.json();conversations.unshift(conv);currentConvId=conv.id;localStorage.setItem('felix_casual_last',conv.id);renderConvList();document.getElementById('convTitleDisplay').textContent=conv.title}const inp=document.getElementById('input');const msg=inp.value.trim();if(!msg&&!selectedFile)return;inp.value='';autoResize(inp);isStreaming=true;document.getElementById('sendBtn').disabled=true;appendMsg('user',msg+(selectedFile?'\n[📎 '+selectedFile.name+']':''));scrollBot();const c=document.getElementById('messages');const d=document.createElement('div');d.className='message assistant';d.innerHTML='<div class="avatar">AI</div><div class="content"><span class="cursor"></span></div>';c.appendChild(d);const cel=d.querySelector('.content');scrollBot();let full='';try{const fd=new FormData();fd.append('message',msg);fd.append('user','felix');if(selectedFile)fd.append('file',selectedFile);const res=await fetch('/api/conversations/'+currentConvId+'/chat',{method:'POST',body:fd});const reader=res.body.getReader();const dec=new TextDecoder();while(true){const{done,value}=await reader.read();if(done)break;for(const line of dec.decode(value).split('\n')){if(!line.startsWith('data: '))continue;try{const data=JSON.parse(line.slice(6));if(data.text){full+=data.text;cel.innerHTML=esc(full)+'<span class="cursor"></span>';scrollBot()}if(data.done){cel.innerHTML=esc(data.cleanText||full);if(data.title){const conv=conversations.find(c=>c.id===currentConvId);if(conv){conv.title=data.title;renderConvList();document.getElementById('convTitleDisplay').textContent=data.title}}}if(data.error)cel.innerHTML='<span style="color:#c0392b">错误: '+data.error+'</span>'}catch(e){}}}}catch(e){cel.innerHTML='<span style="color:#c0392b">连接错误，请重试</span>'}isStreaming=false;document.getElementById('sendBtn').disabled=false;clearFile();inp.focus()}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarBackdrop').classList.toggle('open')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('open')}
;(function(){let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<Math.abs(dy)*1.2)return;const sb=document.getElementById('sidebar');if(dx<-50&&sb.classList.contains('open'))closeSidebar();if(dx>60&&tx<30&&!sb.classList.contains('open')){sb.classList.add('open');document.getElementById('sidebarBackdrop').classList.add('open')}},{passive:true});}())

async function openMemory(){document.getElementById('memoryOverlay').classList.add('open');const r=await fetch('/api/memory-doc/felix');const d=await r.json();document.getElementById('personalMemory').value=d.personal||'';document.getElementById('workMemory').value=d.work||''}
function closeMemory(){document.getElementById('memoryOverlay').classList.remove('open')}
function closeMemoryIfOutside(e){if(e.target===document.getElementById('memoryOverlay'))closeMemory()}
async function saveMemory(){await fetch('/api/memory-doc/felix',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({personal:document.getElementById('personalMemory').value,work:document.getElementById('workMemory').value})});closeMemory()}

if(localStorage.getItem('felix_auth')==='1')loadConversations();
</script>
</body>
</html>
